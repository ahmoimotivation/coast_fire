<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moi's Coast FIRE Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        function CoastFireApp() {
            const [currentAge, setCurrentAge] = useState(29);
            const [retireAge, setRetireAge] = useState(40);
            const [deathAge, setDeathAge] = useState(120);
            const [monthlyTargetPV, setMonthlyTargetPV] = useState(38700);
            const [inflation, setInflation] = useState(5);
            const [cagr, setCagr] = useState(8);
            const [postRetireCagr, setPostRetireCagr] = useState(6);
            const [hoveredData, setHoveredData] = useState(null);

            const results = useMemo(() => {
                const rPre = cagr / 100;
                const rPost = postRetireCagr / 100;
                const i = inflation / 100;
                const realRatePre = (1 + rPre) / (1 + i) - 1;
                const realRatePost = (1 + rPost) / (1 + i) - 1;
                const annualSpendingPV = monthlyTargetPV * 12;

                const yearsToRetire = retireAge - currentAge;
                const yearsInRetirement = deathAge - retireAge;

                let fireTargetPV = 0;
                if (yearsInRetirement > 0) {
                    if (Math.abs(realRatePost) < 0.00001) {
                        fireTargetPV = annualSpendingPV * yearsInRetirement;
                    } else {
                        fireTargetPV = annualSpendingPV * ((1 - Math.pow(1 + realRatePost, -yearsInRetirement)) / realRatePost) * (1 + realRatePost);
                    }
                }

                let coastFirePV = 0;
                if (yearsToRetire >= 0) {
                    if (Math.abs(realRatePre) < 0.00001) {
                        coastFirePV = fireTargetPV;
                    } else {
                        coastFirePV = fireTargetPV / Math.pow(1 + realRatePre, yearsToRetire);
                    }
                }

                let coastTable = [];
                if (yearsToRetire >= 0) {
                    for (let age = currentAge; age <= retireAge; age++) {
                        const n = age - currentAge;
                        const yearsLeft = retireAge - age;
                        const nominal = coastFirePV * Math.pow(1 + rPre, n);
                        const realPV = coastFirePV * Math.pow(1 + realRatePre, n);
                        coastTable.push({ age, yearsLeft, nominal, realPV, isRetire: age === retireAge });
                    }
                }

                let chartData = [];
                let currentReal = coastFirePV;
                let currentNominal = coastFirePV;
                let maxNominal = coastFirePV;

                if (yearsToRetire >= 0 && yearsInRetirement >= 0) {
                    for (let age = currentAge; age <= deathAge; age++) {
                        chartData.push({
                            age,
                            real: Math.max(0, currentReal),
                            nominal: Math.max(0, currentNominal),
                        });

                        if (currentNominal > maxNominal) maxNominal = currentNominal;

                        if (age < retireAge) {
                            currentReal = currentReal * (1 + realRatePre);
                            currentNominal = currentNominal * (1 + rPre);
                        } else if (age < deathAge) {
                            let withdrawalReal = annualSpendingPV;
                            let withdrawalNominal = annualSpendingPV * Math.pow(1 + i, age - currentAge);
                            currentReal = (currentReal - withdrawalReal) * (1 + realRatePost);
                            currentNominal = (currentNominal - withdrawalNominal) * (1 + rPost);
                        }
                    }
                }

                return {
                    coastFirePV, fireTargetPV, fireTargetNominal: fireTargetPV * Math.pow(1 + i, yearsToRetire),
                    realRatePre: realRatePre * 100, realRatePost: realRatePost * 100, chartData, maxNominal, coastTable
                };
            }, [currentAge, retireAge, deathAge, monthlyTargetPV, inflation, cagr, postRetireCagr]);

            const formatMYR = (num) => {
                if (isNaN(num) || num < 0) return "RM 0";
                return new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR', maximumFractionDigits: 0 }).format(num);
            };

            const formatShortMYR = (num) => {
                if (num >= 1000000) return `RM ${(num / 1000000).toFixed(2)}m`;
                if (num >= 1000) return `RM ${(num / 1000).toFixed(0)}k`;
                return formatMYR(num);
            };

            const renderChart = () => {
                if (results.chartData.length === 0) return null;
                const width = 800; const height = 300; const padding = { top: 20, right: 20, bottom: 30, left: 60 };
                const chartWidth = width - padding.left - padding.right; const chartHeight = height - padding.top - padding.bottom;
                const data = results.chartData; const minAge = currentAge; const maxAge = deathAge;
                const maxY = Math.max(results.maxNominal * 1.1, 100000);

                const getX = (age) => padding.left + ((age - minAge) / (maxAge - minAge)) * chartWidth;
                const getY = (value) => padding.top + chartHeight - (value / Math.max(maxY, 1)) * chartHeight;

                const nominalPoints = data.map(d => `${getX(d.age)},${getY(d.nominal)}`).join(' ');
                const realPoints = data.map(d => `${getX(d.age)},${getY(d.real)}`).join(' ');

                return (
                    <div className="relative w-full overflow-hidden mt-6 bg-slate-50 rounded-xl border border-slate-200">
                        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto text-slate-800">
                            <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#cbd5e1" strokeWidth="2" />
                            <line x1={padding.left} y1={padding.top} x2={padding.left} y2={height - padding.bottom} stroke="#cbd5e1" strokeWidth="2" />
                            {retireAge > currentAge && retireAge < deathAge && (
                                <g>
                                    <line x1={getX(retireAge)} y1={padding.top} x2={getX(retireAge)} y2={height - padding.bottom} stroke="#f43f5e" strokeWidth="2" strokeDasharray="5,5" />
                                    <text x={getX(retireAge) + 5} y={padding.top + 15} fontSize="12" fill="#f43f5e" fontWeight="bold">退休 ({retireAge}岁)</text>
                                </g>
                            )}
                            <polyline points={realPoints} fill="none" stroke="#3b82f6" strokeWidth="3" />
                            <polyline points={nominalPoints} fill="none" stroke="#10b981" strokeWidth="3" strokeDasharray="4,4" />
                            {data.map((d, i) => (
                                <rect key={i} x={getX(d.age) - (chartWidth / data.length / 2)} y={padding.top} width={chartWidth / data.length} height={chartHeight} fill="transparent"
                                    onMouseEnter={() => setHoveredData(d)} onMouseLeave={() => setHoveredData(null)} className="cursor-crosshair" />
                            ))}
                            <text x={padding.left - 10} y={getY(maxY * 0.75)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.75)}</text>
                            <text x={padding.left - 10} y={getY(maxY * 0.5)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.5)}</text>
                            <text x={padding.left - 10} y={getY(maxY * 0.25)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.25)}</text>
                            <text x={getX(minAge)} y={height - 10} fontSize="12" textAnchor="middle" fill="#64748b">{minAge}</text>
                            <text x={getX(maxAge)} y={height - 10} fontSize="12" textAnchor="middle" fill="#64748b">{maxAge}</text>
                            {hoveredData && (
                                <g>
                                    <line x1={getX(hoveredData.age)} y1={padding.top} x2={getX(hoveredData.age)} y2={height - padding.bottom} stroke="#94a3b8" strokeWidth="1" />
                                    <circle cx={getX(hoveredData.age)} cy={getY(hoveredData.nominal)} r="4" fill="#10b981" />
                                    <circle cx={getX(hoveredData.age)} cy={getY(hoveredData.real)} r="4" fill="#3b82f6" />
                                </g>
                            )}
                        </svg>
                        {hoveredData && (
                            <div className="absolute top-2 right-2 bg-white/95 p-3 rounded shadow-lg border border-slate-200 pointer-events-none text-sm z-10">
                                <div className="font-bold border-b pb-1 mb-2">年龄: {hoveredData.age}岁</div>
                                <div className="flex items-center gap-2 text-emerald-600 mb-1">
                                    <div className="w-3 h-3 border-2 border-emerald-500 border-dashed"></div>
                                    <span>账面资产: {formatMYR(hoveredData.nominal)}</span>
                                </div>
                                <div className="flex items-center gap-2 text-blue-600">
                                    <div className="w-3 h-3 bg-blue-500"></div>
                                    <span>购买力现值: {formatMYR(hoveredData.real)}</span>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderCoastTable = () => {
                if (!results.coastTable || results.coastTable.length === 0) return null;
                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="text-lg font-bold mb-1">逐年 Coast FIRE 进度表</h3>
                        <p className="text-sm text-slate-500 mb-4">
                            如果你现在就存够 <span className="font-semibold text-blue-600">{formatMYR(results.coastFirePV)}</span> 并让它自动增长（不再投入本金），
                            下面是你每一年账户里「应该」达到的数字。可以拿来对照你的实际组合，检查有没有 on track。
                        </p>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead>
                                    <tr className="border-b-2 border-slate-200 text-slate-500">
                                        <th className="py-2 pr-4 font-medium">年龄</th>
                                        <th className="py-2 pr-4 font-medium">距退休</th>
                                        <th className="py-2 pr-4 font-medium text-right">Coast FIRE 数字<br/><span className="text-xs text-emerald-600 font-normal">账面 (那一年的钱)</span></th>
                                        <th className="py-2 pl-4 font-medium text-right">购买力现值<br/><span className="text-xs text-blue-600 font-normal">(今天的钱)</span></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {results.coastTable.map((row) => (
                                        <tr key={row.age} className={`border-b border-slate-100 ${row.isRetire ? 'bg-rose-50 font-bold' : (row.age === currentAge ? 'bg-blue-50' : 'hover:bg-slate-50')}`}>
                                            <td className="py-2 pr-4">
                                                {row.age} 岁
                                                {row.age === currentAge && <span className="ml-2 text-xs text-blue-600 font-semibold">(现在)</span>}
                                                {row.isRetire && <span className="ml-2 text-xs text-rose-600 font-semibold">(退休)</span>}
                                            </td>
                                            <td className="py-2 pr-4 text-slate-500">{row.yearsLeft > 0 ? `${row.yearsLeft} 年` : '—'}</td>
                                            <td className="py-2 pr-4 text-right font-mono text-emerald-700">{formatMYR(row.nominal)}</td>
                                            <td className="py-2 pl-4 text-right font-mono text-blue-700">{formatMYR(row.realPV)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <p className="text-xs text-slate-400 mt-3">
                            * 账面 = 用退休前 CAGR {cagr}% 名义增长；购买力现值 = 用抗通胀实际回酬 {results.realRatePre.toFixed(2)}% 增长。退休当年账面应达到目标账面 FV。
                        </p>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans text-slate-800">
                    <div className="max-w-6xl mx-auto">
                        <header className="mb-8">
                            <h1 className="text-3xl font-bold text-slate-900 mb-2">Coast FIRE 自由计算器</h1>
                            <p className="text-slate-600">探索规律，掌控人生。计算你现在需要准备多少钱，就能在 {retireAge} 岁安心退休。</p>
                        </header>
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-4 space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-xl font-bold border-b pb-2">基础参数</h2>
                                <div className="space-y-4">
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">当前年龄</label><input type="number" value={currentAge} onChange={(e) => setCurrentAge(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">目标退休年龄</label><input type="number" value={retireAge} onChange={(e) => setRetireAge(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">预期寿命 (岁)</label><input type="number" value={deathAge} onChange={(e) => setDeathAge(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div className="pt-2 border-t">
                                        <label className="block text-sm font-medium text-slate-700 mb-1">退休每月目标生活费 (以现在购买力算)</label>
                                        <div className="relative"><span className="absolute left-3 top-2 text-slate-500">RM</span><input type="number" value={monthlyTargetPV} onChange={(e) => setMonthlyTargetPV(Number(e.target.value))} className="w-full p-2 pl-10 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    </div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">预期通胀率 (%)</label><div className="flex items-center gap-2"><input type="range" min="0" max="15" step="0.1" value={inflation} onChange={(e) => setInflation(Number(e.target.value))} className="w-full" /><span className="w-12 text-right font-mono">{inflation}%</span></div></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">退休前 CAGR (%)</label><div className="flex items-center gap-2"><input type="range" min="0" max="30" step="0.1" value={cagr} onChange={(e) => setCagr(Number(e.target.value))} className="w-full" /><span className="w-12 text-right font-mono">{cagr}%</span></div></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">退休后保守 CAGR (%)</label><div className="flex items-center gap-2"><input type="range" min="0" max="30" step="0.1" value={postRetireCagr} onChange={(e) => setPostRetireCagr(Number(e.target.value))} className="w-full" /><span className="w-12 text-right font-mono">{postRetireCagr}%</span></div></div>
                                </div>
                            </div>
                            <div className="lg:col-span-8 space-y-6">
                                <div className="bg-blue-600 text-white p-8 rounded-2xl shadow-md">
                                    <p className="text-blue-100 font-medium mb-2 text-lg">现在需要的 Coast FIRE 启动本金 ({currentAge}岁)</p>
                                    <h2 className="text-4xl md:text-5xl font-extrabold mb-4">{formatMYR(results.coastFirePV)}</h2>
                                    <p className="text-blue-50 text-sm md:text-base">拥有这笔资金并维持 {cagr}% 增长，现在即可停止投入本金。</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-slate-500 text-sm font-medium mb-1">退休时 ({retireAge}岁) 目标总资金 (现值 PV)</p>
                                        <p className="text-2xl font-bold text-slate-800">{formatMYR(results.fireTargetPV)}</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-slate-500 text-sm font-medium mb-1">退休时 ({retireAge}岁) 目标总资金 (账面 FV)</p>
                                        <p className="text-2xl font-bold text-emerald-600">{formatMYR(results.fireTargetNominal)}</p>
                                    </div>
                                </div>
                                {renderCoastTable()}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-bold mb-1">资产生命周期模拟</h3>
                                    <p className="text-sm text-slate-500">抗通胀实际回酬率: <span className="text-blue-600 font-semibold">退休前 {results.realRatePre.toFixed(2)}%</span> | <span className="text-emerald-600 font-semibold">退休后 {results.realRatePost.toFixed(2)}%</span></p>
                                    {renderChart()}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CoastFireApp />);
    </script>
</body>
</html>
