<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FU Money Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{fu:'#EE6A1E',fud:'#CC5413',fus:'#FCE6D5'},fontFamily:{sans:['Noto Sans SC','system-ui','sans-serif']}}}}</script>
    <style>body{font-family:'Noto Sans SC',system-ui,sans-serif}</style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F5F3EF]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // localStorage: 读取已保存的输入（没有就用预设）
        const LS = (k, d) => { try { const v = localStorage.getItem('cf_' + k); return v === null ? d : Number(v); } catch (e) { return d; } };

        function CoastFireApp() {
            const [currentAge, setCurrentAge] = useState(LS('currentAge', 29));
            const [retireAge, setRetireAge] = useState(LS('retireAge', 40));
            const [deathAge, setDeathAge] = useState(LS('deathAge', 120));
            const [monthlyTargetPV, setMonthlyTargetPV] = useState(LS('monthlyTargetPV', 38700));
            const [inflation, setInflation] = useState(LS('inflation', 5));
            const [cagr, setCagr] = useState(LS('cagr', 8));
            const [postRetireCagr, setPostRetireCagr] = useState(LS('postRetireCagr', 6));
            // 新增：我的现况
            const [currentNetWorth, setCurrentNetWorth] = useState(LS('currentNetWorth', 100000));
            const [monthlyIncome, setMonthlyIncome] = useState(LS('monthlyIncome', 8000));
            const [monthlyExpense, setMonthlyExpense] = useState(LS('monthlyExpense', 5000));
            const [incomeGrowth, setIncomeGrowth] = useState(LS('incomeGrowth', 5));
            const [hoveredData, setHoveredData] = useState(null);

            // 每次输入改变就自动保存进浏览器
            useEffect(() => {
                try {
                    const s = { currentAge, retireAge, deathAge, monthlyTargetPV, inflation, cagr, postRetireCagr, currentNetWorth, monthlyIncome, monthlyExpense, incomeGrowth };
                    Object.keys(s).forEach(k => localStorage.setItem('cf_' + k, s[k]));
                } catch (e) {}
            }, [currentAge, retireAge, deathAge, monthlyTargetPV, inflation, cagr, postRetireCagr, currentNetWorth, monthlyIncome, monthlyExpense, incomeGrowth]);

            const resetAll = () => {
                try { ['currentAge','retireAge','deathAge','monthlyTargetPV','inflation','cagr','postRetireCagr','currentNetWorth','monthlyIncome','monthlyExpense','incomeGrowth'].forEach(k => localStorage.removeItem('cf_' + k)); } catch (e) {}
                setCurrentAge(29); setRetireAge(40); setDeathAge(120); setMonthlyTargetPV(38700); setInflation(5); setCagr(8); setPostRetireCagr(6); setCurrentNetWorth(100000); setMonthlyIncome(8000); setMonthlyExpense(5000); setIncomeGrowth(5);
            };

            const results = useMemo(() => {
                const rPre = cagr / 100;
                const rPost = postRetireCagr / 100;
                const i = inflation / 100;
                const realRatePre = (1 + rPre) / (1 + i) - 1;
                const realRatePost = (1 + rPost) / (1 + i) - 1;
                const annualSpendingPV = monthlyTargetPV * 12;

                const yearsToRetire = retireAge - currentAge;
                const yearsInRetirement = deathAge - retireAge;

                let fireTargetPV = 0;
                if (yearsInRetirement > 0) {
                    if (Math.abs(realRatePost) < 0.00001) {
                        fireTargetPV = annualSpendingPV * yearsInRetirement;
                    } else {
                        fireTargetPV = annualSpendingPV * ((1 - Math.pow(1 + realRatePost, -yearsInRetirement)) / realRatePost) * (1 + realRatePost);
                    }
                }

                let coastFirePV = 0;
                if (yearsToRetire >= 0) {
                    if (Math.abs(realRatePre) < 0.00001) {
                        coastFirePV = fireTargetPV;
                    } else {
                        coastFirePV = fireTargetPV / Math.pow(1 + realRatePre, yearsToRetire);
                    }
                }

                let coastTable = [];
                if (yearsToRetire >= 0) {
                    for (let age = currentAge; age <= retireAge; age++) {
                        const n = age - currentAge;
                        const yearsLeft = retireAge - age;
                        const nominal = coastFirePV * Math.pow(1 + rPre, n);
                        const realPV = coastFirePV * Math.pow(1 + realRatePre, n);
                        coastTable.push({ age, yearsLeft, nominal, realPV, isRetire: age === retireAge });
                    }
                }

                // ===== 我的现况投影：几时达到 FU Money =====
                const gInc = incomeGrowth / 100;
                // 「完全自由」所需：在某一岁直接退休、靠资产撑到 deathAge 所需的本金（当年账面）
                const annuityPV = (yrs) => {
                    if (yrs <= 0) return 0;
                    if (Math.abs(realRatePost) < 0.00001) return annualSpendingPV * yrs;
                    return annualSpendingPV * ((1 - Math.pow(1 + realRatePost, -yrs)) / realRatePost) * (1 + realRatePost);
                };
                const projByAge = {};
                const fullReqByAge = {};
                let coastFireAge = null, coastFireNW = 0, coastFireRequired = 0;
                let fullFireAge = null, fullFireNW = 0, fullFireRequired = 0;
                let projNW = currentNetWorth;
                if (yearsToRetire >= 0) {
                    for (let age = currentAge; age <= retireAge; age++) {
                        const n = age - currentAge;
                        const required = coastFirePV * Math.pow(1 + rPre, n);
                        const fullReq = annuityPV(deathAge - age) * Math.pow(1 + i, n);
                        projByAge[age] = projNW;
                        fullReqByAge[age] = fullReq;
                        if (coastFireAge === null && projNW >= required) {
                            coastFireAge = age; coastFireNW = projNW; coastFireRequired = required;
                        }
                        if (fullFireAge === null && projNW >= fullReq) {
                            fullFireAge = age; fullFireNW = projNW; fullFireRequired = fullReq;
                        }
                        const incMon = monthlyIncome * Math.pow(1 + gInc, n);
                        const expMon = monthlyExpense * Math.pow(1 + i, n);
                        const annualSaving = (incMon - expMon) * 12; // 允许负数：负现金流(透支)会吃掉净值，可能永远追不上
                        projNW = projNW * (1 + rPre) + annualSaving;
                    }
                }
                let shortfallAtRetire = null;
                if (coastFireAge === null && yearsToRetire >= 0) {
                    const reqRetire = coastFirePV * Math.pow(1 + rPre, retireAge - currentAge);
                    const projRetire = projByAge[retireAge] !== undefined ? projByAge[retireAge] : projNW;
                    shortfallAtRetire = reqRetire - projRetire;
                }
                let maxProj = 0;
                Object.values(projByAge).forEach(v => { if (v > maxProj) maxProj = v; });
                coastTable = coastTable.map(r => ({ ...r, projNW: projByAge[r.age], projNWPV: projByAge[r.age] !== undefined ? projByAge[r.age] / Math.pow(1 + i, r.age - currentAge) : undefined, fullFireReq: fullReqByAge[r.age], isFullFree: r.age === fullFireAge, reached: projByAge[r.age] >= r.nominal }));

                let chartData = [];
                let currentReal = coastFirePV;
                let currentNominal = coastFirePV;
                let maxNominal = coastFirePV;

                if (yearsToRetire >= 0 && yearsInRetirement >= 0) {
                    for (let age = currentAge; age <= deathAge; age++) {
                        chartData.push({
                            age,
                            real: Math.max(0, currentReal),
                            nominal: Math.max(0, currentNominal),
                            proj: (age <= retireAge && projByAge[age] !== undefined) ? Math.max(0, projByAge[age]) : null,
                        });

                        if (currentNominal > maxNominal) maxNominal = currentNominal;

                        if (age < retireAge) {
                            currentReal = currentReal * (1 + realRatePre);
                            currentNominal = currentNominal * (1 + rPre);
                        } else if (age < deathAge) {
                            let withdrawalReal = annualSpendingPV;
                            let withdrawalNominal = annualSpendingPV * Math.pow(1 + i, age - currentAge);
                            currentReal = (currentReal - withdrawalReal) * (1 + realRatePost);
                            currentNominal = (currentNominal - withdrawalNominal) * (1 + rPost);
                        }
                    }
                }

                let drawdownTable = [];
                let depletedAge = null;
                // 提款表起点：若能提早「完全自由」就用那一岁（并用当年实际预计净值起算），否则用退休岁数
                const drawRetireAge = (fullFireAge !== null) ? fullFireAge : retireAge;
                const yearsInDraw = deathAge - drawRetireAge;
                if (yearsToRetire >= 0 && yearsInDraw > 0) {
                    let balNom, balReal;
                    if (fullFireAge !== null) {
                        balNom = fullFireNW;
                        balReal = fullFireNW / Math.pow(1 + i, drawRetireAge - currentAge);
                    } else {
                        balNom = coastFirePV;
                        balReal = coastFirePV;
                        for (let a = currentAge; a < retireAge; a++) { balNom *= (1 + rPre); balReal *= (1 + realRatePre); }
                    }
                    for (let age = drawRetireAge; age < deathAge; age++) {
                        const startNom = balNom;
                        const startReal = balReal;
                        const wNom = annualSpendingPV * Math.pow(1 + i, age - currentAge);
                        const wReal = annualSpendingPV;
                        const afterNom = (startNom - wNom) * (1 + rPost);
                        const afterReal = (startReal - wReal) * (1 + realRatePost);
                        const depleted = startNom <= wNom;
                        if (depleted && depletedAge === null) depletedAge = age;
                        drawdownTable.push({ age, wNom, wReal, endNom: afterNom, endReal: afterReal, depleted });
                        balNom = afterNom;
                        balReal = afterReal;
                        if (afterNom <= 0) break;
                    }
                }

                // ===== 人生资产旅程线（与上面两张表同口径）：存钱 → 上岸/完全自由 → 退休提款 =====
                let journeyData = [];
                let journeyMax = 0, journeyPeakAge = null, journeyPeakVal = 0;
                if (yearsToRetire >= 0 && yearsInRetirement >= 0) {
                    for (let age = currentAge; age < drawRetireAge; age++) {
                        const v = projByAge[age] !== undefined ? projByAge[age] : 0;
                        journeyData.push({ age, value: Math.max(0, v) });
                    }
                    let bal = projByAge[drawRetireAge] !== undefined ? projByAge[drawRetireAge] : (fullFireAge !== null ? fullFireNW : 0);
                    for (let age = drawRetireAge; age <= deathAge; age++) {
                        journeyData.push({ age, value: Math.max(0, bal) });
                        if (age < deathAge) {
                            const wNom = annualSpendingPV * Math.pow(1 + i, age - currentAge);
                            bal = (bal - wNom) * (1 + rPost);
                        }
                    }
                    journeyData.forEach(d => { if (d.value > journeyMax) journeyMax = d.value; if (d.value > journeyPeakVal) { journeyPeakVal = d.value; journeyPeakAge = d.age; } });
                }

                return {
                    coastFirePV, fireTargetPV, fireTargetNominal: fireTargetPV * Math.pow(1 + i, yearsToRetire),
                    realRatePre: realRatePre * 100, realRatePost: realRatePost * 100, chartData, maxNominal, coastTable, drawdownTable, depletedAge,
                    coastFireAge, coastFireNW, coastFireRequired, fullFireAge, fullFireNW, fullFireRequired, drawRetireAge, shortfallAtRetire, maxProj,
                    journeyData, journeyMax, journeyPeakAge, journeyPeakVal
                };
            }, [currentAge, retireAge, deathAge, monthlyTargetPV, inflation, cagr, postRetireCagr, currentNetWorth, monthlyIncome, monthlyExpense, incomeGrowth]);

            const formatMYR = (num) => {
                if (isNaN(num) || num < 0) return "RM 0";
                return new Intl.NumberFormat('en-MY', { style: 'currency', currency: 'MYR', maximumFractionDigits: 0 }).format(num);
            };

            const formatShortMYR = (num) => {
                if (num >= 1000000) return `RM ${(num / 1000000).toFixed(2)}m`;
                if (num >= 1000) return `RM ${(num / 1000).toFixed(0)}k`;
                return formatMYR(num);
            };

            // ===== 新增：人生资产旅程折线图（存钱 → 上岸/完全自由 → 退休提款）=====
            const renderJourneyChart = () => {
                const data = results.journeyData;
                if (!data || data.length === 0) return null;
                const width = 800, height = 320;
                const padding = { top: 34, right: 20, bottom: 40, left: 60 };
                const chartWidth = width - padding.left - padding.right;
                const chartHeight = height - padding.top - padding.bottom;
                const minAge = currentAge, maxAge = deathAge;
                const maxY = Math.max(results.journeyMax * 1.12, 100000);
                const getX = (age) => padding.left + ((age - minAge) / Math.max(maxAge - minAge, 1)) * chartWidth;
                const getY = (v) => padding.top + chartHeight - (v / Math.max(maxY, 1)) * chartHeight;
                const coastAge = results.coastFireAge;
                const retire = results.drawRetireAge;
                const isFull = results.fullFireAge !== null;
                const hasCoast = coastAge !== null && coastAge < retire;
                const saveEnd = hasCoast ? coastAge : retire;

                const seg = (from, to) => data.filter(d => d.age >= from && d.age <= to).map(d => `${getX(d.age)},${getY(d.value)}`).join(' ');
                const saveLine = seg(minAge, saveEnd);
                const coastLine = hasCoast ? seg(coastAge, retire) : '';
                const drawLine = seg(retire, maxAge);
                const areaPts = data.map(d => `${getX(d.age)},${getY(d.value)}`).join(' ');
                const areaPath = `${padding.left},${getY(0)} ${areaPts} ${getX(maxAge)},${getY(0)}`;
                const coastPt = hasCoast ? data.find(d => d.age === coastAge) : null;
                const retirePt = data.find(d => d.age === retire);

                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="text-lg font-bold mb-1">你的钱一生怎么走 <span className="text-fu">🚶 存钱 → 🏖️ {isFull ? '完全自由' : '上岸'} → 🌴 退休花钱</span></h3>
                        <p className="text-sm text-slate-500 mb-4">
                            这条线是你户口里真实的钱（跟下面两张表同一套算法）：<span className="font-semibold text-fu">先靠存钱把净值冲上去</span>；
                            {hasCoast
                                ? <span> {coastAge} 岁<span className="font-semibold text-orange-600">上岸</span>（可停止再投本金）；</span>
                                : <span> </span>}
                            {isFull
                                ? <span><span className="font-semibold text-emerald-600">{retire} 岁「完全自由」</span>可立刻停工退休；</span>
                                : <span>到 {retire} 岁退休；</span>}
                            <span className="font-semibold text-blue-600"> 之后开始提款养老，看它怎么走</span>。
                        </p>
                        <div className="relative w-full overflow-hidden bg-slate-50 rounded-xl border border-slate-200">
                            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto">
                                {hasCoast
                                    ? <rect x={getX(minAge)} y={padding.top} width={getX(coastAge) - getX(minAge)} height={chartHeight} fill="#FEF3C7" opacity="0.6" />
                                    : <rect x={getX(minAge)} y={padding.top} width={getX(retire) - getX(minAge)} height={chartHeight} fill="#FEF3C7" opacity="0.6" />}
                                {hasCoast && <rect x={getX(coastAge)} y={padding.top} width={getX(retire) - getX(coastAge)} height={chartHeight} fill="#DCFCE7" opacity="0.6" />}
                                <rect x={getX(retire)} y={padding.top} width={getX(maxAge) - getX(retire)} height={chartHeight} fill="#DBEAFE" opacity="0.5" />
                                <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#cbd5e1" strokeWidth="2" />
                                <line x1={padding.left} y1={padding.top} x2={padding.left} y2={height - padding.bottom} stroke="#cbd5e1" strokeWidth="2" />
                                <polygon points={areaPath} fill="#EE6A1E" opacity="0.06" />
                                <polyline points={saveLine} fill="none" stroke="#EE6A1E" strokeWidth="3.5" />
                                {hasCoast && coastLine && <polyline points={coastLine} fill="none" stroke="#10b981" strokeWidth="3.5" />}
                                <polyline points={drawLine} fill="none" stroke="#3b82f6" strokeWidth="3.5" />
                                {hasCoast && coastAge > minAge && coastAge < maxAge && coastPt && (
                                    <g>
                                        <line x1={getX(coastAge)} y1={padding.top} x2={getX(coastAge)} y2={height - padding.bottom} stroke="#EE6A1E" strokeWidth="2" strokeDasharray="4,4" />
                                        <circle cx={getX(coastAge)} cy={getY(coastPt.value)} r="5" fill="#EE6A1E" stroke="#fff" strokeWidth="2" />
                                        <text x={getX(coastAge)} y={padding.top - 18} fontSize="12" textAnchor="middle" fill="#CC5413" fontWeight="bold">上岸 {coastAge}岁</text>
                                        <text x={getX(coastAge)} y={padding.top - 5} fontSize="10" textAnchor="middle" fill="#CC5413">可停止存钱</text>
                                    </g>
                                )}
                                {retire > minAge && retire < maxAge && retirePt && (
                                    <g>
                                        <line x1={getX(retire)} y1={padding.top} x2={getX(retire)} y2={height - padding.bottom} stroke={isFull ? '#059669' : '#3b82f6'} strokeWidth="2" strokeDasharray="5,5" />
                                        <circle cx={getX(retire)} cy={getY(retirePt.value)} r="5" fill={isFull ? '#059669' : '#3b82f6'} stroke="#fff" strokeWidth="2" />
                                        <text x={getX(retire)} y={padding.top - 5} fontSize="11" textAnchor="middle" fill={isFull ? '#047857' : '#2563eb'} fontWeight="bold">{isFull ? `完全自由 ${retire}岁` : `退休 ${retire}岁`}</text>
                                    </g>
                                )}
                                {results.journeyPeakAge && (() => {
                                    const px = getX(results.journeyPeakAge);
                                    const anchor = px > width - 140 ? 'end' : (px < padding.left + 60 ? 'start' : 'middle');
                                    const py = Math.max(getY(results.journeyPeakVal) - 8, padding.top + 10);
                                    return (
                                    <g>
                                        <circle cx={px} cy={getY(results.journeyPeakVal)} r="4" fill="#111111" />
                                        <text x={px} y={py} fontSize="10" textAnchor={anchor} fill="#111111" fontWeight="bold">峰值 {formatShortMYR(results.journeyPeakVal)}</text>
                                    </g>
                                    );
                                })()}
                                <text x={padding.left - 10} y={getY(maxY * 0.75)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.75)}</text>
                                <text x={padding.left - 10} y={getY(maxY * 0.5)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.5)}</text>
                                <text x={padding.left - 10} y={getY(maxY * 0.25)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.25)}</text>
                                <text x={getX(minAge)} y={height - 12} fontSize="11" textAnchor="middle" fill="#64748b">{minAge}岁</text>
                                <text x={getX(maxAge)} y={height - 12} fontSize="11" textAnchor="middle" fill="#64748b">{maxAge}岁</text>
                            </svg>
                        </div>
                        <div className="flex flex-wrap gap-4 mt-3 text-xs text-slate-600">
                            <span className="flex items-center gap-1"><span className="inline-block w-4 h-1 rounded" style={{background:'#EE6A1E'}}></span>存钱冲刺</span>
                            {hasCoast && <span className="flex items-center gap-1"><span className="inline-block w-4 h-1 rounded" style={{background:'#10b981'}}></span>上岸后靠复利</span>}
                            <span className="flex items-center gap-1"><span className="inline-block w-4 h-1 rounded" style={{background:'#3b82f6'}}></span>退休提款</span>
                        </div>
                        <p className="text-xs text-slate-400 mt-2">* 这条线用的是你的<span className="font-semibold">实际预计净值</span>（含每年收入/储蓄），退休起点 = {isFull ? `完全自由那一年（${retire}岁）的实际净值` : `${retire}岁退休时净值`}，之后每年提款（随通胀 {inflation}% 变多）、用退休后 {postRetireCagr}% 回报滚——所以它和下方「逐年提款表」是同一个故事、同一组数字。</p>
                    </div>
                );
            };

            const renderChart = () => {
                if (results.chartData.length === 0) return null;
                const width = 800; const height = 300; const padding = { top: 20, right: 20, bottom: 30, left: 60 };
                const chartWidth = width - padding.left - padding.right; const chartHeight = height - padding.top - padding.bottom;
                const data = results.chartData; const minAge = currentAge; const maxAge = deathAge;
                const maxY = Math.max(results.maxNominal * 1.1, (results.maxProj || 0) * 1.1, 100000);

                const getX = (age) => padding.left + ((age - minAge) / (maxAge - minAge)) * chartWidth;
                const getY = (value) => padding.top + chartHeight - (value / Math.max(maxY, 1)) * chartHeight;

                const nominalPoints = data.map(d => `${getX(d.age)},${getY(d.nominal)}`).join(' ');
                const realPoints = data.map(d => `${getX(d.age)},${getY(d.real)}`).join(' ');
                const projPoints = data.filter(d => d.proj !== null && d.proj !== undefined).map(d => `${getX(d.age)},${getY(d.proj)}`).join(' ');

                return (
                    <div className="relative w-full overflow-hidden mt-6 bg-slate-50 rounded-xl border border-slate-200">
                        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto text-slate-800">
                            <line x1={padding.left} y1={height - padding.bottom} x2={width - padding.right} y2={height - padding.bottom} stroke="#cbd5e1" strokeWidth="2" />
                            <line x1={padding.left} y1={padding.top} x2={padding.left} y2={height - padding.bottom} stroke="#cbd5e1" strokeWidth="2" />
                            {retireAge > currentAge && retireAge < deathAge && (
                                <g>
                                    <line x1={getX(retireAge)} y1={padding.top} x2={getX(retireAge)} y2={height - padding.bottom} stroke="#f43f5e" strokeWidth="2" strokeDasharray="5,5" />
                                    <text x={getX(retireAge) + 5} y={padding.top + 15} fontSize="12" fill="#f43f5e" fontWeight="bold">退休 ({retireAge}岁)</text>
                                </g>
                            )}
                            <polyline points={realPoints} fill="none" stroke="#3b82f6" strokeWidth="3" />
                            <polyline points={nominalPoints} fill="none" stroke="#10b981" strokeWidth="3" strokeDasharray="4,4" />
                            {projPoints && <polyline points={projPoints} fill="none" stroke="#f97316" strokeWidth="3" />}
                            {results.coastFireAge && (
                                <g>
                                    <line x1={getX(results.coastFireAge)} y1={padding.top} x2={getX(results.coastFireAge)} y2={height - padding.bottom} stroke="#f97316" strokeWidth="2" strokeDasharray="3,3" />
                                    <circle cx={getX(results.coastFireAge)} cy={getY(results.coastFireNW)} r="5" fill="#f97316" stroke="#fff" strokeWidth="2" />
                                    <text x={getX(results.coastFireAge) + 6} y={padding.top + 34} fontSize="12" fill="#f97316" fontWeight="bold">上岸 ({results.coastFireAge}岁)</text>
                                </g>
                            )}
                            {data.map((d, i) => (
                                <rect key={i} x={getX(d.age) - (chartWidth / data.length / 2)} y={padding.top} width={chartWidth / data.length} height={chartHeight} fill="transparent"
                                    onMouseEnter={() => setHoveredData(d)} onMouseLeave={() => setHoveredData(null)} className="cursor-crosshair" />
                            ))}
                            <text x={padding.left - 10} y={getY(maxY * 0.75)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.75)}</text>
                            <text x={padding.left - 10} y={getY(maxY * 0.5)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.5)}</text>
                            <text x={padding.left - 10} y={getY(maxY * 0.25)} fontSize="10" textAnchor="end" fill="#64748b">{formatShortMYR(maxY * 0.25)}</text>
                            <text x={getX(minAge)} y={height - 10} fontSize="12" textAnchor="middle" fill="#64748b">{minAge}</text>
                            <text x={getX(maxAge)} y={height - 10} fontSize="12" textAnchor="middle" fill="#64748b">{maxAge}</text>
                            {hoveredData && (
                                <g>
                                    <line x1={getX(hoveredData.age)} y1={padding.top} x2={getX(hoveredData.age)} y2={height - padding.bottom} stroke="#94a3b8" strokeWidth="1" />
                                    <circle cx={getX(hoveredData.age)} cy={getY(hoveredData.nominal)} r="4" fill="#10b981" />
                                    <circle cx={getX(hoveredData.age)} cy={getY(hoveredData.real)} r="4" fill="#3b82f6" />
                                    {hoveredData.proj !== null && hoveredData.proj !== undefined && <circle cx={getX(hoveredData.age)} cy={getY(hoveredData.proj)} r="4" fill="#f97316" />}
                                </g>
                            )}
                        </svg>
                        {hoveredData && (
                            <div className="absolute top-2 right-2 bg-white/95 p-3 rounded shadow-lg border border-slate-200 pointer-events-none text-sm z-10">
                                <div className="font-bold border-b pb-1 mb-2">年龄: {hoveredData.age}岁</div>
                                <div className="flex items-center gap-2 text-emerald-600 mb-1">
                                    <div className="w-3 h-3 border-2 border-emerald-500 border-dashed"></div>
                                    <span>账面资产: {formatMYR(hoveredData.nominal)}</span>
                                </div>
                                <div className="flex items-center gap-2 text-blue-600 mb-1">
                                    <div className="w-3 h-3 bg-blue-500"></div>
                                    <span>购买力现值: {formatMYR(hoveredData.real)}</span>
                                </div>
                                {hoveredData.proj !== null && hoveredData.proj !== undefined && (
                                    <div className="flex items-center gap-2 text-orange-600">
                                        <div className="w-3 h-3 bg-orange-500"></div>
                                        <span>你的预计净值: {formatMYR(hoveredData.proj)}</span>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            const renderCoastTable = () => {
                if (!results.coastTable || results.coastTable.length === 0) return null;
                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="text-lg font-bold mb-1">逐年 FU Money 进度表</h3>
                        <p className="text-sm text-slate-500 mb-4">
                            <span className="font-semibold text-emerald-600">绿色 = 每一年所需的 FU Money 启动本金</span>——越迟才存到，需要的越大（复利时间变短）。
                            <span className="font-semibold text-orange-600">橙色 = 你按现况预计的净值</span>（含每年收入成长 + 储蓄；若负现金流会倒退）。橙色第一次 ≥ 绿色那一年，就是你<span className="font-semibold text-orange-600">「上岸」</span>的时候；若更早存够「直接退休」的全部本金，那一年会以<span className="font-semibold text-green-700">绿底标出「完全自由」</span>（比上岸更进一步，不必等到退休年龄）。
                        </p>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead>
                                    <tr className="border-b-2 border-slate-200 text-slate-500">
                                        <th className="py-2 pr-4 font-medium">年龄</th>
                                        <th className="py-2 pr-4 font-medium">距退休</th>
                                        <th className="py-2 pr-4 font-medium text-right">FU Money 数字<br/><span className="text-xs text-emerald-600 font-normal">账面 (那一年的钱)</span></th>
                                        <th className="py-2 pr-4 font-medium text-right">你的预计净值<br/><span className="text-xs text-orange-600 font-normal">账面 (那一年的钱)</span></th>
                                        <th className="py-2 pr-4 font-medium text-right">你的预计净值<br/><span className="text-xs text-amber-500 font-normal">现值 (今天的钱)</span></th>
                                        <th className="py-2 pr-4 font-medium text-center">状态</th>
                                        <th className="py-2 pl-4 font-medium text-right">购买力现值<br/><span className="text-xs text-blue-600 font-normal">(今天的钱)</span></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {results.coastTable.map((row) => (
                                        <tr key={row.age} className={`border-b border-slate-100 ${row.isFullFree ? 'bg-green-100 font-semibold' : (row.age === results.coastFireAge ? 'bg-orange-100 font-semibold' : (row.isRetire ? 'bg-rose-50 font-bold' : (row.age === currentAge ? 'bg-blue-50' : 'hover:bg-slate-50')))}`}>
                                            <td className="py-2 pr-4">
                                                {row.age} 岁
                                                {row.age === currentAge && <span className="ml-2 text-xs text-blue-600 font-semibold">(现在)</span>}
                                                {row.age === results.coastFireAge && <span className="ml-2 text-xs text-orange-600 font-semibold">(上岸!)</span>}
                                                {row.isFullFree && <span className="ml-2 text-xs text-green-700 font-semibold">(完全自由!)</span>}
                                                {row.isRetire && <span className="ml-2 text-xs text-rose-600 font-semibold">(退休)</span>}
                                            </td>
                                            <td className="py-2 pr-4 text-slate-500">{row.yearsLeft > 0 ? `${row.yearsLeft} 年` : '—'}</td>
                                            <td className="py-2 pr-4 text-right font-mono text-emerald-700">{formatMYR(row.nominal)}</td>
                                            <td className="py-2 pr-4 text-right font-mono text-orange-700">{formatMYR(row.projNW)}</td>
                                            <td className="py-2 pr-4 text-right font-mono text-amber-500">{formatMYR(row.projNWPV)}</td>
                                            <td className="py-2 pr-4 text-center">{row.reached ? <span className="text-emerald-600 font-bold">✓ 达标</span> : <span className="text-rose-500 text-xs">差 {formatShortMYR(row.nominal - row.projNW)}</span>}</td>
                                            <td className="py-2 pl-4 text-right font-mono text-blue-700">{formatMYR(row.realPV)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <p className="text-xs text-slate-400 mt-3">
                            * 账面 = 用退休前投资回报 ROI {cagr}% 名义增长；你的预计净值现值 = 把当年账面净值用通胀 {inflation}% 折回今天的购买力；购买力现值 = 用抗通胀实际回酬 {results.realRatePre.toFixed(2)}% 增长。退休当年账面应达到目标账面 FV。
                        </p>
                    </div>
                );
            };

            const renderDrawdownTable = () => {
                if (!results.drawdownTable || results.drawdownTable.length === 0) return null;
                return (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="text-lg font-bold mb-1">退休后逐年提款 & 资产剩余表</h3>
                        <p className="text-sm text-slate-500 mb-4">
                            从 {results.drawRetireAge} 岁开始{results.fullFireAge !== null ? `（提早「完全自由」，比原定 ${retireAge} 岁退休更早，用那一年的预计净值起算）` : '（退休）'}，每年提款过生活（花费随通胀 {inflation}% 逐年变多），剩下的钱继续以退休后投资回报 ROI {postRetireCagr}% 增长。
                            下面是每一年的花费和年末还剩多少。
                            {results.depletedAge
                                ? <span className="text-rose-600 font-semibold"> ⚠️ 按目前参数，资产在约 {results.depletedAge} 岁就见底了。</span>
                                : <span className="text-emerald-600 font-semibold"> ✓ 一直到 {deathAge} 岁资产都花不完，甚至还在增长。</span>}
                        </p>
                        <div className="overflow-x-auto max-h-96 overflow-y-auto border border-slate-100 rounded-lg">
                            <table className="w-full text-sm text-left">
                                <thead className="sticky top-0 bg-slate-50">
                                    <tr className="border-b-2 border-slate-200 text-slate-500">
                                        <th className="py-2 px-3 font-medium">年龄</th>
                                        <th className="py-2 px-3 font-medium text-right">当年花费<br/><span className="text-xs text-rose-500 font-normal">账面 (那一年的钱)</span></th>
                                        <th className="py-2 px-3 font-medium text-right">当年花费<br/><span className="text-xs text-slate-400 font-normal">现值 (今天的钱)</span></th>
                                        <th className="py-2 px-3 font-medium text-right">年末资产剩余<br/><span className="text-xs text-emerald-600 font-normal">账面</span></th>
                                        <th className="py-2 px-3 font-medium text-right">年末资产剩余<br/><span className="text-xs text-blue-600 font-normal">现值</span></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {results.drawdownTable.map((row) => (
                                        <tr key={row.age} className={`border-b border-slate-100 ${row.depleted ? 'bg-rose-50 font-semibold text-rose-700' : 'hover:bg-slate-50'}`}>
                                            <td className="py-2 px-3">
                                                {row.age} 岁
                                                {row.age === results.drawRetireAge && <span className="ml-2 text-xs text-rose-600 font-semibold">{results.fullFireAge !== null ? '(完全自由·退休)' : '(退休)'}</span>}
                                            </td>
                                            <td className="py-2 px-3 text-right font-mono text-rose-600">{formatMYR(row.wNom)}</td>
                                            <td className="py-2 px-3 text-right font-mono text-slate-400">{formatMYR(row.wReal)}</td>
                                            <td className="py-2 px-3 text-right font-mono text-emerald-700">{formatMYR(row.endNom)}</td>
                                            <td className="py-2 px-3 text-right font-mono text-blue-700">{formatMYR(row.endReal)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <p className="text-xs text-slate-400 mt-3">
                            * 花费账面 = 现值月开销 RM {monthlyTargetPV.toLocaleString()} × 12，随通胀逐年放大；年末资产剩余 = (年初资产 − 当年花费) × (1 + {postRetireCagr}%)。资产见底那一年会标红。
                        </p>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans text-slate-800">
                    <div className="max-w-6xl mx-auto">
                        <header className="mb-8 flex flex-wrap justify-between items-start gap-3">
                            <div>
                                <h1 className="text-3xl md:text-4xl font-black text-[#111111] mb-2">FU Money <span className="text-fu">计算器</span></h1>
                                <p className="text-slate-600">算出你的自由数字。看你现在需要多少钱、几时能财务自由，就能在 {retireAge} 岁安心退休。<span className="text-fu font-medium">（输入会自动保存，下次打开还在）</span></p>
                            </div>
                            <button onClick={resetAll} className="text-sm px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 whitespace-nowrap">↺ 重置为预设</button>
                        </header>
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-4 space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-xl font-bold border-b pb-2">基础参数</h2>
                                <div className="space-y-4">
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">当前年龄</label><input type="number" value={currentAge} onChange={(e) => setCurrentAge(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">目标退休年龄</label><input type="number" value={retireAge} onChange={(e) => setRetireAge(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">预期寿命 (岁)</label><input type="number" value={deathAge} onChange={(e) => setDeathAge(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div className="pt-2 border-t">
                                        <label className="block text-sm font-medium text-slate-700 mb-1">退休每月目标生活费 (以现在购买力算)</label>
                                        <div className="relative"><span className="absolute left-3 top-2 text-slate-500">RM</span><input type="number" value={monthlyTargetPV} onChange={(e) => setMonthlyTargetPV(Number(e.target.value))} className="w-full p-2 pl-10 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    </div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">预期通胀率 (%)</label><div className="flex items-center gap-2"><input type="range" min="0" max="15" step="0.1" value={inflation} onChange={(e) => setInflation(Number(e.target.value))} className="w-full" /><span className="w-12 text-right font-mono">{inflation}%</span></div></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">退休前投资回报 ROI (%)</label><div className="flex items-center gap-2"><input type="range" min="0" max="30" step="0.1" value={cagr} onChange={(e) => setCagr(Number(e.target.value))} className="w-full" /><span className="w-12 text-right font-mono">{cagr}%</span></div></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">退休后投资回报 ROI (%)</label><div className="flex items-center gap-2"><input type="range" min="0" max="30" step="0.1" value={postRetireCagr} onChange={(e) => setPostRetireCagr(Number(e.target.value))} className="w-full" /><span className="w-12 text-right font-mono">{postRetireCagr}%</span></div></div>
                                </div>

                                <h2 className="text-xl font-bold border-b pb-2 pt-4">我的现况 <span className="text-sm font-normal text-fu">（看几时上岸）</span></h2>
                                <div className="space-y-4">
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">现在的净值 Net Worth</label><div className="relative"><span className="absolute left-3 top-2 text-slate-500">RM</span><input type="number" value={currentNetWorth} onChange={(e) => setCurrentNetWorth(Number(e.target.value))} className="w-full p-2 pl-10 border border-slate-300 rounded focus:ring-2 focus:ring-fu outline-none" /></div></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">现在每月收入</label><div className="relative"><span className="absolute left-3 top-2 text-slate-500">RM</span><input type="number" value={monthlyIncome} onChange={(e) => setMonthlyIncome(Number(e.target.value))} className="w-full p-2 pl-10 border border-slate-300 rounded focus:ring-2 focus:ring-fu outline-none" /></div></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">现在每月生活费</label><div className="relative"><span className="absolute left-3 top-2 text-slate-500">RM</span><input type="number" value={monthlyExpense} onChange={(e) => setMonthlyExpense(Number(e.target.value))} className="w-full p-2 pl-10 border border-slate-300 rounded focus:ring-2 focus:ring-fu outline-none" /></div><p className={`text-xs mt-1 ${(monthlyIncome - monthlyExpense) < 0 ? 'text-rose-500 font-semibold' : 'text-slate-400'}`}>{(monthlyIncome - monthlyExpense) >= 0 ? `每月可存 ≈ RM ${(monthlyIncome - monthlyExpense).toLocaleString()}` : `⚠️ 每月透支 RM ${Math.abs(monthlyIncome - monthlyExpense).toLocaleString()}（负现金流会吃掉净值）`}（生活费随通胀 {inflation}% 逐年变多，收入随上面的 % 成长）</p></div>
                                    <div><label className="block text-sm font-medium text-slate-700 mb-1">未来每年收入增加 (%)</label><div className="flex items-center gap-2"><input type="range" min="0" max="20" step="0.5" value={incomeGrowth} onChange={(e) => setIncomeGrowth(Number(e.target.value))} className="w-full accent-orange-500" /><span className="w-12 text-right font-mono">{incomeGrowth}%</span></div></div>
                                </div>
                            </div>
                            <div className="lg:col-span-8 space-y-6">
                                <div className="bg-[#111111] text-white p-8 rounded-2xl shadow-md">
                                    <p className="text-white/60 font-medium mb-2 text-lg">现在需要的 FU Money 启动本金 ({currentAge}岁)</p>
                                    <h2 className="text-4xl md:text-5xl font-black text-fu mb-4">{formatMYR(results.coastFirePV)}</h2>
                                    <p className="text-white/80 text-sm md:text-base">拥有这笔资金、每年维持 <span className="text-fu font-semibold">{cagr}%</span> 投资回报，从现在起就可以<span className="text-white font-semibold">停止再投入本金</span>——它会自己滚到 {retireAge} 岁退休。退休后，即可每月领 <span className="text-fu font-semibold">RM {monthlyTargetPV.toLocaleString()}</span>（以今天购买力算）一直花到 {deathAge} 岁。</p>
                                </div>

                                {results.coastFireAge !== null ? (
                                    <div className="bg-fu text-white p-8 rounded-2xl shadow-md">
                                        <p className="text-white/80 font-medium mb-2 text-lg">按你的现况，预计几时上岸 (达到 FU Money)</p>
                                        <h2 className="text-4xl md:text-5xl font-black mb-2">{results.coastFireAge} 岁 <span className="text-2xl md:text-3xl font-bold">（还有 {results.coastFireAge - currentAge} 年）</span></h2>
                                        <p className="text-white/90 text-sm md:text-base">那一年你的预计净值 {formatMYR(results.coastFireNW)} ≥ 当年所需 FU Money {formatMYR(results.coastFireRequired)}。<span className="font-semibold">之后一分钱都不必再存</span>，靠复利滚到 {retireAge} 岁退休；退休后每月领 <span className="font-semibold">RM {monthlyTargetPV.toLocaleString()}</span>（今天购买力）一直花到 {deathAge} 岁。</p>
                                    </div>
                                ) : (
                                    <div className="bg-rose-500 text-white p-8 rounded-2xl shadow-md">
                                        <p className="text-rose-100 font-medium mb-2 text-lg">按你的现况，到 {retireAge} 岁还没到 FU Money</p>
                                        <h2 className="text-3xl md:text-4xl font-extrabold mb-2">还差 {formatMYR(results.shortfallAtRetire)}</h2>
                                        <p className="text-rose-50 text-sm md:text-base">拉高收入成长 / 多存一点（尤其负现金流会越存越少）/ 提高退休前投资回报 ROI，或调整退休年龄与目标生活费，再看看。越迟开始，需要的 FU Money 越大。</p>
                                    </div>
                                )}
                                {results.fullFireAge !== null && (
                                    <div className="bg-emerald-600 text-white p-8 rounded-2xl shadow-md">
                                        <p className="text-white/80 font-medium mb-2 text-lg">🎉 更进一步：预计几时「完全自由」（净值够直接退休，不必等到 {retireAge} 岁）</p>
                                        <h2 className="text-4xl md:text-5xl font-black mb-2">{results.fullFireAge} 岁 <span className="text-2xl md:text-3xl font-bold">（还有 {results.fullFireAge - currentAge} 年）</span></h2>
                                        <p className="text-white/90 text-sm md:text-base">那一年你的预计净值 {formatMYR(results.fullFireNW)} ≥ 当年「完全自由」所需 {formatMYR(results.fullFireRequired)}。到这里就能<span className="font-semibold">立刻停工退休</span>，不只是上岸——从 {results.fullFireAge} 岁起每月领 <span className="font-semibold">RM {monthlyTargetPV.toLocaleString()}</span>（今天购买力）一直花到 {deathAge} 岁{results.depletedAge ? `（约 ${results.depletedAge} 岁见底）` : '，资产还花不完'}。</p>
                                    </div>
                                )}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-slate-500 text-sm font-medium mb-1">退休时 ({retireAge}岁) 目标总资金 (现值 PV)</p>
                                        <p className="text-2xl font-bold text-slate-800">{formatMYR(results.fireTargetPV)}</p>
                                        <p className="text-xs text-slate-400 mt-2">用今天的购买力衡量的退休总需求——即「现在的钱」要有这么多，才够每月 RM {monthlyTargetPV.toLocaleString()} 花到 {deathAge} 岁。</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-slate-500 text-sm font-medium mb-1">退休时 ({retireAge}岁) 目标总资金 (账面 FV)</p>
                                        <p className="text-2xl font-bold text-emerald-600">{formatMYR(results.fireTargetNominal)}</p>
                                        <p className="text-xs text-slate-400 mt-2">这是 {retireAge} 岁那一年户口里<span className="text-emerald-600 font-semibold">真正要出现的数字</span>（已算进 {inflation}% 通胀）。达到它，就能每月领 RM {monthlyTargetPV.toLocaleString()}（今天购买力）到 {deathAge} 岁。</p>
                                    </div>
                                </div>
                                {renderJourneyChart()}
                                {renderCoastTable()}
                                {renderDrawdownTable()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CoastFireApp />);
    </script>
